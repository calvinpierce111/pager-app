<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Pager</title>
    <style>
        /* ========== ЦВЕТА ========== */
        :root {
            --blue: #007AFF; --red: #FF3B30; --green: #34C759; --gray: #8E8E93;
            --gray4: #E5E5EA; --gray5: #F2F2F7; --bg: #FFFFFF; --text: #000000;
            --text-secondary: #8E8E93; --separator: rgba(0,0,0,0.08);
            --bubble-mine: #007AFF; --bubble-other: #E9E9ED; --input-bg: #F2F2F7;
            --tab-bg: #007AFF; --header-bg: rgba(255,255,255,0.85);
            --card-bg: #FFFFFF; --icon-color: #FFFFFF; --verify-fill: #007AFF;
            --skeleton: #E5E5EA;
        }
        body.dark {
            --bg: #000000; --text: #FFFFFF; --text-secondary: #98989D;
            --separator: rgba(255,255,255,0.08); --bubble-mine: #0A84FF; --bubble-other: #1C1C1E;
            --input-bg: #1C1C1E; --tab-bg: #0A84FF; --header-bg: rgba(28,28,30,0.85);
            --card-bg: #1C1C1E; --gray4: #38383A; --gray5: #1C1C1E;
            --icon-color: #FFFFFF; --verify-fill: #0A84FF; --skeleton: #38383A;
        }

        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            -webkit-tap-highlight-color: transparent;
            overflow-y: auto;
            overflow-x: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            font-size: 16px;
        }

        img {
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
            max-width: 100%;
            height: auto;
        }

        #app {
            width: 100%;
            min-height: 100vh;
            max-width: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: visible;
        }

        .header {
            padding: 0 16px;
            display: flex;
            align-items: center;
            background: var(--header-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-bottom: 0.5px solid var(--separator);
            height: 48px;
            flex-shrink: 0;
            z-index: 20;
            position: sticky;
            top: 0;
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .header-title { font-size: 18px; font-weight: 600; color: var(--text); }
        .header-back { background: none; border: none; cursor: pointer; padding: 4px 8px; display: flex; align-items: center; color: var(--blue); }
        .header-back svg { width: 24px; height: 24px; }
        .header-spacer { flex: 1; }

        .icon-btn {
            background: none; border: none; cursor: pointer; padding: 8px;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: var(--text); position: relative;
            width: 40px; height: 40px;
        }
        .icon-btn svg { width: 24px; height: 24px; }

        /* ========== КОНТЕНТ (РАБОТАЮЩИЙ СКРОЛЛ) ========== */
        .content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 8px 16px 80px;
            padding-bottom: max(80px, env(safe-area-inset-bottom));
            overscroll-behavior-y: contain;
        }
        .content::-webkit-scrollbar { display: none; }

        .create-post-card {
            border-bottom: 0.5px solid var(--separator);
            padding: 12px 0;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            background: transparent;
        }
        .create-post-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--gray4); overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .create-post-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .create-post-placeholder { color: var(--text-secondary); font-size: 15px; }

        .post-card {
            padding: 14px 0;
            border-bottom: 0.5px solid var(--separator);
        }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .post-author-row { flex: 1; cursor: pointer; }
        .post-author { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .post-time { font-size: 13px; color: var(--text-secondary); margin-top: 1px; }
        .post-text { font-size: 15px; line-height: 1.5; margin-bottom: 10px; word-break: break-word; }
        .post-image {
            width: 100%; aspect-ratio: 3/4; object-fit: cover;
            border-radius: 8px; margin-bottom: 8px; cursor: pointer;
        }
        .post-actions { display: flex; gap: 20px; margin-top: 6px; }
        .post-action-btn {
            background: none; border: none; cursor: pointer;
            font-size: 14px; color: var(--text-secondary);
            display: flex; align-items: center; gap: 4px;
            padding: 6px 8px; border-radius: 6px;
        }
        .post-action-btn.liked { color: var(--red); }
        .post-action-btn svg { width: 22px; height: 22px; }

        .post-menu-btn {
            position: absolute; top: 14px; right: 0;
            background: none; border: none; cursor: pointer;
            padding: 6px; border-radius: 50%; z-index: 5;
        }
        .post-menu-btn svg { width: 18px; height: 18px; }
        .post-menu-dropdown {
            position: absolute; top: 40px; right: 0;
            background: var(--card-bg); border: 0.5px solid var(--separator);
            border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,0.12);
            padding: 4px; display: none; flex-direction: column;
            z-index: 10; min-width: 140px;
        }
        .post-menu-dropdown.show { display: flex; }
        .post-menu-item {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 14px; border-radius: 10px; cursor: pointer;
            font-size: 14px; color: var(--text);
        }
        .post-menu-item.danger { color: var(--red); }

        /* ========== АВАТАРКИ ========== */
        .avatar {
            border-radius: 50%; background: var(--gray4);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-shrink: 0; position: relative;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
        .avatar.sm { width: 32px; height: 32px; min-width: 32px; }
        .avatar.md { width: 40px; height: 40px; min-width: 40px; }
        .avatar.lg { width: 52px; height: 52px; min-width: 52px; }
        .avatar.xl { width: 120px; height: 120px; min-width: 120px; }

        .verified-badge {
            display: inline-flex; align-items: center;
            margin-left: 2px; vertical-align: middle;
        }
        .verified-badge svg { width: 22px; height: 22px; }

        /* ========== НИЖНЯЯ ПАНЕЛЬ ========== */
        .tab-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--header-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 0.5px solid var(--separator);
            height: 56px; display: none;
            justify-content: space-around; align-items: center;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .tab-bar.show { display: flex; }
        .tab-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 2px; color: var(--gray); font-size: 11px;
            font-weight: 500; cursor: pointer; padding: 4px 12px;
            border-radius: 8px;
        }
        .tab-item.active { color: var(--blue); font-weight: 600; }
        .tab-item svg { width: 24px; height: 24px; fill: currentColor; }

        /* ========== ЧАТ ========== */
        .chat-item {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 0; border-bottom: 0.5px solid var(--separator);
            cursor: pointer; background: transparent;
        }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .chat-last-msg {
            color: var(--text-secondary); font-size: 14px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .message-row { display: flex; margin-bottom: 6px; }
        .message-row.mine { justify-content: flex-end; }
        .message-row.other { justify-content: flex-start; }
        .msg-img {
            max-width: 220px; aspect-ratio: 3/4;
            object-fit: cover; border-radius: 18px;
        }
        .message-bubble {
            max-width: 78%; padding: 8px 14px; border-radius: 18px;
            font-size: 15px; line-height: 1.4; word-break: break-word;
        }
        .message-mine { background: var(--bubble-mine); color: white; }
        .message-other { background: var(--bubble-other); color: var(--text); }

        /* ========== ПОЛЕ ВВОДА (ЗАКРЕПЛЕНО ВНИЗУ) ========== */
        .input-bar {
            display: flex; padding: 8px 12px; gap: 8px;
            background: var(--header-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 0.5px solid var(--separator);
            align-items: center; min-height: 48px; flex-shrink: 0;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            position: sticky;
            bottom: 0;
            z-index: 10;
        }
        .input-field {
            flex: 1; padding: 10px 16px; border-radius: 20px;
            border: 0.5px solid var(--separator); background: var(--input-bg);
            font-size: 15px; outline: none; color: var(--text);
        }
        .input-field:focus { border-color: var(--blue); }

        /* ========== АВТОРИЗАЦИЯ ========== */
        .auth-container {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; padding: 32px 24px;
            gap: 14px; background: var(--bg);
        }
        .auth-title { font-size: 26px; font-weight: 700; }
        .auth-input {
            width: 100%; max-width: 300px; padding: 14px 16px;
            border-radius: 12px; border: 0.5px solid var(--separator);
            background: var(--input-bg); font-size: 16px; outline: none;
            color: var(--text);
        }
        .auth-input:focus { border-color: var(--blue); }
        .auth-btn {
            width: 100%; max-width: 300px; padding: 14px;
            border-radius: 14px; font-size: 16px; border: none;
            cursor: pointer; font-weight: 600;
        }
        .auth-btn.primary { background: var(--blue); color: white; }
        .auth-btn.text { background: transparent; color: var(--blue); font-weight: 400; }
        .auth-divider { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 300px; }
        .auth-divider-line { flex: 1; height: 0.5px; background: var(--separator); }
        .auth-divider-text { color: var(--text-secondary); font-size: 13px; }

        /* ========== ПОИСК ========== */
        .search-input {
            width: 100%; padding: 12px 16px; border-radius: 12px;
            border: 0.5px solid var(--separator); background: var(--input-bg);
            font-size: 15px; outline: none; color: var(--text);
            margin-bottom: 16px;
        }
        .search-input:focus { border-color: var(--blue); }

        .user-card {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 0; border-bottom: 0.5px solid var(--separator);
            cursor: pointer; justify-content: space-between;
            background: transparent;
        }
        .user-card-left { display: flex; align-items: center; gap: 14px; }

        .follow-btn {
            background: var(--blue); color: white; border: none;
            padding: 8px 20px; border-radius: 16px; font-size: 13px;
            font-weight: 600; cursor: pointer;
        }
        .follow-btn.unfollow { background: var(--gray4); color: var(--text); }

        /* ========== МОДАЛЬНЫЕ ОКНА ========== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            z-index: 200; display: flex; align-items: flex-end;
            justify-content: center;
        }
        .modal-sheet {
            background: var(--bg); border-radius: 20px 20px 0 0;
            width: 100%; max-width: 600px; padding: 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            max-height: 80vh;
            overflow-y: auto;
        }

        .notification-dropdown {
            position: fixed; top: 48px; right: 8px;
            width: 320px; background: var(--card-bg);
            border: 0.5px solid var(--separator);
            border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,0.12);
            z-index: 200; max-height: 60vh; overflow-y: auto; display: none;
        }
        .notification-dropdown.show { display: block; }

        /* ========== НАСТРОЙКИ ========== */
        .settings-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 0.5px solid var(--separator);
            cursor: pointer;
        }
        .settings-label { font-size: 16px; }
        .settings-value { font-size: 16px; color: var(--text-secondary); }

        .empty-state {
            text-align: center; color: var(--text-secondary);
            margin-top: 60px; font-size: 15px;
        }

        /* ========== ТОСТ ========== */
        .toast {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
            background: #1d1d1f; color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 14px; z-index: 500;
            opacity: 0; transition: opacity 0.2s; pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* ========== ПРОСМОТР ИЗОБРАЖЕНИЙ ========== */
        .image-viewer {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 300; display: flex; align-items: center;
            justify-content: center;
        }
        .image-viewer img {
            max-width: 90%; max-height: 80vh; object-fit: contain;
            border-radius: 16px;
        }
        .image-viewer-close {
            position: absolute; top: 16px; right: 16px;
            background: rgba(255,255,255,0.2); color: white;
            border: none; width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; font-size: 18px;
        }

        .like-heart {
            position: absolute; pointer-events: none; z-index: 50;
            animation: heartBurst 0.6s ease-out forwards;
        }

        .skeleton {
            background: var(--skeleton); border-radius: 8px;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; }
        }
        @keyframes heartBurst {
            0% { transform: scale(0); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }

        input[type="file"] { display: none; }

        /* ========== ПК-ВЕРСИЯ ========== */
        @media(min-width: 768px) {
            body { padding: 0; background: #FFFFFF; }
            body.dark { background: #000000; }
            #app { min-height: 100vh; border-radius: 0; max-width: 100%; box-shadow: none; overflow: visible; }
            .header {
                height: 52px;
                margin: 0 auto; max-width: 700px;
                width: 100%;
            }
            .content {
                padding: 16px 0 80px; max-width: 700px;
                margin: 0 auto; width: 100%;
            }
            .tab-bar {
                display: flex !important; height: 52px;
                max-width: 700px; margin: 0 auto;
                left: 50%; right: auto; transform: translateX(-50%);
                width: 100%; bottom: 0;
                border-radius: 0;
            }
            .tab-item { font-size: 13px; font-weight: 600; }
            .post-image { aspect-ratio: 4/3; max-width: 100%; border-radius: 12px; }
            .msg-img { aspect-ratio: 4/3; max-width: 300px; }
            .image-viewer img { aspect-ratio: 4/3; }
            .avatar.md { width: 48px; height: 48px; min-width: 48px; }
            .avatar.lg { width: 60px; height: 60px; min-width: 60px; }
            .avatar.xl { width: 140px; height: 140px; min-width: 140px; }
            .post-author { font-size: 18px; }
            .post-text { font-size: 17px; }
            .post-time { font-size: 14px; }
            .chat-name { font-size: 18px; }
            .chat-last-msg { font-size: 14px; }
            .message-bubble { font-size: 16px; }
            .header-title { font-size: 20px; }
            .profile-cover {
                display: flex; height: 180px; width: 100%;
                max-width: 700px; border-radius: 16px;
                margin: 0 auto 12px auto;
            }
            .content::-webkit-scrollbar { display: block; width: 6px; }
            .content::-webkit-scrollbar-track { background: transparent; }
            .content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
            body.dark .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="toast" class="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/firestore.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
